<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cek cuaca saat ini dan prakiraan 5 hari untuk kota mana pun." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>" />
    <title>Cuaca Kota | Weather App</title>
  </head>
  <body class="min-h-screen bg-sky-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100">
    <main class="mx-auto max-w-md px-4 py-12 lg:max-w-3xl">
      <div class="mb-6 flex items-center justify-between gap-4">
        <h1 class="text-3xl font-bold tracking-tight">
          <button
            id="home-btn"
            type="button"
            class="cursor-pointer rounded hover:text-sky-700 focus:outline-2 focus:outline-offset-4 focus:outline-sky-600 dark:hover:text-sky-300"
          >
            Cuaca hari ini
          </button>
        </h1>
        <button
          id="unit-btn"
          type="button"
          aria-label="Ganti satuan suhu"
          class="rounded-lg border border-slate-300 bg-white px-3 py-1 text-sm font-medium hover:bg-slate-100 focus:outline-2 focus:outline-offset-2 focus:outline-sky-600 dark:border-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700"
        >
          °C
        </button>
      </div>

      <form id="search-form" class="mb-4 flex gap-2">
        <label for="city-input" class="sr-only">Nama kota</label>
        <input
          id="city-input"
          type="text"
          required
          placeholder="Cari kota, misalnya Jakarta"
          class="flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2 focus:outline-2 focus:outline-sky-600 dark:border-slate-600 dark:bg-slate-800"
        />
        <button
          type="submit"
          id="search-btn"
          class="rounded-lg bg-sky-700 px-4 py-2 font-medium text-white hover:bg-sky-800 focus:outline-2 focus:outline-offset-2 focus:outline-sky-600 disabled:opacity-50"
        >
          Cari
        </button>
      </form>

      <div id="history" class="mb-4 flex flex-wrap items-center gap-2"></div>

      <section id="hero" class="mb-6 flex flex-col items-center py-6 text-center">
        <div class="relative mb-6 flex h-40 w-full max-w-xs items-center justify-center" aria-hidden="true">
          <div class="sun"></div>
          <div class="cloud absolute top-20 left-16"></div>
          <div class="cloud absolute right-8 bottom-4 opacity-80" style="animation-duration: 12s"></div>
        </div>
        <h2 id="greeting" class="text-3xl font-bold tracking-tight">Halo!</h2>
        <p class="mt-2 max-w-sm text-slate-600 dark:text-slate-300">
          Mau cek cuaca di kota mana hari ini? Ketik di atas atau pilih salah satu kota.
        </p>
      </section>

      <p id="status" class="hidden mb-4 text-center text-slate-600 dark:text-slate-300" aria-live="polite">
        Ketik nama kota untuk melihat cuacanya.
      </p>

      <div id="skeleton" class="hidden animate-pulse rounded-2xl bg-white p-6 shadow dark:bg-slate-800" aria-hidden="true">
        <div class="mb-4 h-5 w-1/2 rounded bg-slate-200 dark:bg-slate-700"></div>
        <div class="mb-4 h-14 w-1/3 rounded bg-slate-200 dark:bg-slate-700"></div>
        <div class="mb-6 h-5 w-2/3 rounded bg-slate-200 dark:bg-slate-700"></div>
        <div class="h-16 rounded bg-slate-200 dark:bg-slate-700"></div>
      </div>

      <section id="result" class="fade-in hidden rounded-2xl bg-white p-6 shadow dark:bg-slate-800">
        <div class="lg:grid lg:grid-cols-2 lg:gap-10">
          <div>
            <p id="place" class="text-lg font-semibold"></p>
            <div class="my-2 flex items-center justify-between gap-4">
              <p id="temp" class="text-6xl font-bold"></p>
              <span id="icon" aria-hidden="true" class="text-7xl"></span>
            </div>
            <p id="desc" class="mb-4 text-xl"></p>
            <dl id="details" class="grid grid-cols-2 gap-3 border-t border-slate-200 pt-4 dark:border-slate-700"></dl>
            <p id="tip" class="mt-4 rounded-lg bg-sky-50 p-3 text-sm text-sky-900 dark:bg-sky-950/60 dark:text-sky-100"></p>
          </div>
          <div>
            <h2 class="mt-6 mb-2 text-lg font-semibold lg:mt-0">Prakiraan 5 hari</h2>
            <ul id="forecast" class="divide-y divide-slate-200 dark:divide-slate-700"></ul>
          </div>
        </div>
      </section>

      <footer class="mt-8 text-center text-sm text-slate-600 dark:text-slate-300">
        Data cuaca dari
        <a href="https://open-meteo.com/" target="_blank" rel="noopener" class="underline hover:text-sky-700 dark:hover:text-sky-300">Open-Meteo.com</a>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
