<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cek cuaca saat ini dan prakiraan 5 hari untuk kota mana pun."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>"
    />
    <title>Cuaca Kota | Weather App</title>
  </head>
  <body
    class="min-h-screen bg-sky-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100"
  >
    <main class="mx-auto max-w-md px-4 py-12">
      <div class="mb-6 flex items-center justify-between gap-4">
        <h1 class="text-3xl font-bold tracking-tight">Cuaca hari ini</h1>
        <button
          id="unit-btn"
          type="button"
          aria-label="Ganti satuan suhu"
          class="rounded-lg border border-slate-300 bg-white px-3 py-1 text-sm font-medium hover:bg-slate-100 focus:outline-2 focus:outline-offset-2 focus:outline-sky-600 dark:border-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700"
        >
          °C
        </button>
      </div>

      <form id="search-form" class="mb-4 flex gap-2">
        <label for="city-input" class="sr-only">Nama kota</label>
        <input
          id="city-input"
          type="text"
          required
          placeholder="Cari kota, misalnya Jakarta"
          class="flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2 focus:outline-2 focus:outline-sky-600 dark:border-slate-600 dark:bg-slate-800"
        />
        <button
          type="submit"
          id="search-btn"
          class="rounded-lg bg-sky-700 px-4 py-2 font-medium text-white hover:bg-sky-800 focus:outline-2 focus:outline-offset-2 focus:outline-sky-600 disabled:opacity-50"
        >
          Cari
        </button>
      </form>

      <div id="history" class="mb-4 flex flex-wrap gap-2"></div>

      <p
        id="status"
        class="mb-4 text-center text-slate-600 dark:text-slate-300"
        aria-live="polite"
      >
        Ketik nama kota untuk melihat cuacanya.
      </p>

      <div
        id="skeleton"
        class="hidden animate-pulse rounded-2xl bg-white p-6 shadow dark:bg-slate-800"
        aria-hidden="true"
      >
        <div
          class="mb-4 h-5 w-1/2 rounded bg-slate-200 dark:bg-slate-700"
        ></div>
        <div
          class="mb-4 h-14 w-1/3 rounded bg-slate-200 dark:bg-slate-700"
        ></div>
        <div
          class="mb-6 h-5 w-2/3 rounded bg-slate-200 dark:bg-slate-700"
        ></div>
        <div class="h-16 rounded bg-slate-200 dark:bg-slate-700"></div>
      </div>

      <section
        id="result"
        class="hidden rounded-2xl bg-white p-6 shadow dark:bg-slate-800"
      >
        <p id="place" class="text-lg font-semibold"></p>
        <div class="my-2 flex items-center justify-between gap-4">
          <p id="temp" class="text-6xl font-bold"></p>
          <span id="icon" aria-hidden="true" class="text-7xl"></span>
        </div>
        <p id="desc" class="mb-4 text-xl"></p>
        <dl
          class="grid grid-cols-2 gap-4 border-t border-slate-200 pt-4 dark:border-slate-700"
        >
          <div>
            <dt class="text-sm text-slate-600 dark:text-slate-300">
              Kelembapan
            </dt>
            <dd id="humidity" class="text-lg font-medium"></dd>
          </div>
          <div>
            <dt class="text-sm text-slate-600 dark:text-slate-300">
              Kecepatan angin
            </dt>
            <dd id="wind" class="text-lg font-medium"></dd>
          </div>
        </dl>
        <h2 class="mt-6 mb-2 text-lg font-semibold">Prakiraan 5 hari</h2>
        <ul
          id="forecast"
          class="divide-y divide-slate-200 dark:divide-slate-700"
        ></ul>
      <section id="result" class="fade-in hidden rounded-2xl bg-white p-6 shadow dark:bg-slate-800"></section>
      </section>

      <footer
        class="mt-8 text-center text-sm text-slate-600 dark:text-slate-300"
      >
        Data cuaca dari
        <a
          href="https://open-meteo.com/"
          target="_blank"
          rel="noopener"
          class="underline hover:text-sky-700 dark:hover:text-sky-300"
          >Open-Meteo.com</a
        >
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
